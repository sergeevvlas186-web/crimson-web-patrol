<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160508"><title>Багровая Сеть — мобильный тест</title><style>html,body{margin:0;height:100%;background:#08060a;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.box{text-align:center;padding:24px}.bar{width:min(78vw,320px);height:10px;border-radius:999px;overflow:hidden;background:#28141c;margin:14px auto}.bar>i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#ff355d,#ffbd48);transition:width .2s}small{color:#aa929d}</style></head><body><div class="box"><b>БАГРОВАЯ СЕТЬ</b><div class="bar"><i id="p"></i></div><small id="s">Загружаем мобильную сборку…</small></div><script>
(async()=>{const parts=6,p=document.getElementById('p'),s=document.getElementById('s');try{let b64='';for(let i=0;i<parts;i++){s.textContent=`Загрузка ресурсов ${i+1}/${parts}`;b64+=await (await fetch(`bundle/${i}.part?${Date.now()}`)).text();p.style.width=`${8+(i+1)/parts*46}%`}const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));s.textContent='Распаковываем игру…';const ds=new DecompressionStream('gzip');const tar=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());const dec=new TextDecoder(),files={};let o=0;while(o+512<=tar.length){const h=tar.slice(o,o+512);if(h.every(x=>x===0))break;const name=dec.decode(h.slice(0,100)).replace(/\0.*$/,'').replace(/^\.\//,'');const size=parseInt(dec.decode(h.slice(124,136)).replace(/\0.*$/,'').trim()||'0',8)||0;o+=512;files[name]=tar.slice(o,o+size);o+=Math.ceil(size/512)*512}p.style.width='72%';const text=n=>dec.decode(files[n]);const urls={};for(const n of Object.keys(files))if(n.startsWith('assets/chibi/')&&n.endsWith('.webp'))urls[n]=URL.createObjectURL(new Blob([files[n]],{type:'image/webp'}));let html=text('index.html'),js=text('game.js');for(const [n,u] of Object.entries(urls)){html=html.split(n).join(u);js=js.split(n).join(u)}html=html.replace('<link rel="stylesheet" href="style.css">',`<style>${text('style.css')}</style>`).replace('<link rel="stylesheet" href="premium_skin.css">',`<style>${text('premium_skin.css')}</style>`).replace('<script src="game.js"></script>',`<script>${js.replace(/<\\\/script/gi,'<\\\\/script')}<\\/script>`);p.style.width='100%';s.textContent='Запускаем…';setTimeout(()=>{document.open();document.write(html);document.close()},120)}catch(e){console.error(e);s.textContent='Не удалось загрузить сборку. Обнови страницу.';p.style.background='#ff365e'}})();
</script></body></html>
